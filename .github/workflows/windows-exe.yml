name: windows-exe

# Builds the Windows release on a real Windows runner: a single-file
# KeyForge.exe, an Inno Setup installer with every dependency inside, and a
# portable zip.  PyInstaller cannot cross-compile, so this is the only place a
# Windows binary can come from.  Tags publish all three as release assets;
# manual runs keep them as a workflow artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            packaging/windows/requirements-build.txt

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notmatch '^v?\d+\.\d+') { $v = "1.0.0" }
          "value=$($v -replace '^v','')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build exe, installer and portable zip
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version "${{ steps.ver.outputs.value }}"

      # Upload before the checks: a build that starts but fails a check is still
      # worth keeping, and the check step needs the log it produces.
      - uses: actions/upload-artifact@v4
        with:
          name: KeyForge-windows-x64
          path: |
            dist/windows/KeyForge.exe
            dist/windows/KeyForge-Setup-*.exe
            dist/windows/KeyForge-*-portable.zip
          if-no-files-found: error

      - name: Verify the bundle and the installer
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA "KeyForge"
          $log   = Join-Path $data "keyforge.log"
          $boot  = Join-Path $data "boot.log"
          $crash = Join-Path $data "crash.log"

          # Everything that could explain a silent death: the launcher's boot
          # marker, any traceback, the app log, whether the one-file bundle
          # unpacked, and what is still running.
          function Show-Logs {
            foreach ($f in @($boot, $crash, $log)) {
              Write-Host "--- $f"
              if (Test-Path $f) { Get-Content $f } else { Write-Host "(absent)" }
            }
            Write-Host "--- unpacked bundles"
            Get-ChildItem $env:TEMP -Filter "_MEI*" -Directory -ErrorAction SilentlyContinue |
              Select-Object Name, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "--- KeyForge processes"
            Get-Process KeyForge -ErrorAction SilentlyContinue |
              Select-Object Id, StartTime, Responding | Format-Table -AutoSize | Out-String | Write-Host
          }

          function Run-Selftest([string]$exe, [int]$timeoutSec = 180) {
            Remove-Item $log, $boot, $crash -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
            if (-not $p.WaitForExit($timeoutSec * 1000)) {
              taskkill /F /T /PID $p.Id | Out-Null
              Show-Logs
              # No boot marker means the crash was in the PyInstaller
              # bootloader, before any of our code ran.
              if (-not (Test-Path $boot)) { throw "the bootloader never started Python: $exe" }
              throw "selftest hung: $exe"
            }
            Show-Logs
            if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode)): $exe" }
          }

          Write-Host "=== bare exe"
          Run-Selftest (Resolve-Path "dist/windows/KeyForge.exe")

          Write-Host "=== installer"
          $setup = Get-ChildItem "dist/windows/KeyForge-Setup-*.exe" | Select-Object -First 1
          $dir = Join-Path $env:TEMP "KeyForgeInstalled"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          $p = Start-Process -FilePath $setup.FullName -PassThru -Wait `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "=== installed app"
          Run-Selftest (Join-Path $dir "KeyForge.exe")

          Write-Host "=== installed app serves the UI"
          $srv = Start-Process -FilePath (Join-Path $dir "KeyForge.exe") `
                 -ArgumentList "--no-browser", "--port", "8901" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 700
              $code = curl.exe -s -o page.html -w "%{http_code}" --max-time 3 http://127.0.0.1:8901/
              if ($code -eq "200" -and (Select-String -Path page.html -Pattern "index-" -Quiet)) {
                Write-Host "ui: served"
                Write-Host "status:" (curl.exe -s --max-time 3 http://127.0.0.1:8901/api/status)
                $ok = $true
                break
              }
            }
          } finally {
            if ($srv) { taskkill /F /T /PID $srv.Id | Out-Null }
          }
          if (-not $ok) {
            Show-Logs
            Get-NetTCPConnection -LocalPort 8901 -ErrorAction SilentlyContinue |
              Format-Table -AutoSize | Out-String | Write-Host
            throw "the installed app never served the UI on port 8901"
          }

          Write-Host "=== uninstall"
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -PassThru -Wait `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" | Out-Null
          if (Test-Path (Join-Path $dir "KeyForge.exe")) { throw "uninstall left KeyForge.exe behind" }
          Write-Host "uninstalled cleanly"

      - name: Attach the release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "KeyForge for Windows x64: a single-file KeyForge.exe, a per-user installer, and a portable zip. Everything is bundled - Python, numpy, SoundCard, hidapi.dll and wchisp.exe - so the target machine needs nothing installed. Hardware is the iGear Raptor only; flashing still needs the WinUSB driver (Zadig) - see docs/WINDOWS.md."
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "KeyForge $tag" --notes $notes
          }
          gh release upload $tag `
            dist/windows/KeyForge.exe `
            dist/windows/KeyForge-Setup-*.exe `
            dist/windows/KeyForge-*-portable.zip `
            --clobber
