name: windows-exe

# Builds KeyForge.exe on a real Windows runner: PyInstaller cannot cross-compile,
# so this is the only way to produce a Windows binary.  Tags publish the exe as a
# release asset; manual runs keep it as a workflow artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            packaging/windows/requirements-build.txt

      - name: Build KeyForge.exe
        shell: pwsh
        run: ./packaging/windows/build.ps1

      # Upload before the checks: a build that starts but fails a check is still
      # worth keeping, and the next step needs the log it produces.
      - uses: actions/upload-artifact@v4
        with:
          name: KeyForge-windows-x64
          path: dist/windows/KeyForge.exe
          if-no-files-found: error

      - name: Selftest inside the exe
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "KeyForge\keyforge.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist/windows/KeyForge.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $log) { Write-Host "--- keyforge.log"; Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Serve the UI from the exe
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "KeyForge\keyforge.log"
          $p = Start-Process -FilePath "dist/windows/KeyForge.exe" -ArgumentList "--no-browser", "--port", "8901" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 700
              $code = curl.exe -s -o page.html -w "%{http_code}" --max-time 3 http://127.0.0.1:8901/
              if ($code -eq "200" -and (Select-String -Path page.html -Pattern "index-" -Quiet)) {
                Write-Host "ui: served (index.html references a bundle)"
                $api = curl.exe -s --max-time 3 http://127.0.0.1:8901/api/status
                Write-Host "status:" $api
                $ok = $true
                break
              }
            }
          } finally {
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          if (-not $ok) {
            Write-Host "--- process"
            if ($p.HasExited) { Write-Host "exited with code $($p.ExitCode)" }
            else { Write-Host "still running, pid $($p.Id)" }
            Write-Host "--- listeners"
            Get-NetTCPConnection -LocalPort 8901 -ErrorAction SilentlyContinue |
              Format-Table -AutoSize | Out-String | Write-Host
            if (Test-Path $log) { Write-Host "--- keyforge.log"; Get-Content $log }
            throw "the exe never served the UI on port 8901"
          }

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "KeyForge for Windows x64 (single file). Run it and the UI opens at http://127.0.0.1:8765/. Hardware is the iGear Raptor only; flashing also needs wchisp and the WinUSB driver - see docs/WINDOWS.md."
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "KeyForge $tag" --notes $notes
          }
          gh release upload $tag dist/windows/KeyForge.exe --clobber
